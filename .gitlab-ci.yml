stages:
  - test
  - report
  - sbom

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_TAG

default:
  tags:
    - flarenetwork
  artifacts:
    expire_in: 3 days

variables:
  GOLANG_VERSION: "1.26.6"
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.cache/go-cache
  COVERAGE_FILE: "coverage.out"
  COBERTURA_FILE: "coverage.xml"
  # Pinned commit for github.com/boumenot/gocover-cobertura, same one the
  # test-go@2 component uses to produce its Cobertura report.
  GOCOVER_COBERTURA_VERSION: "4afa1205ab3b54ae098dd4724c1657aad10f7484"

include:
  - component: gitlab.com/flarenetwork/ci-components-private/lgtm@2
  - component: gitlab.com/flarenetwork/ci-components-private/dependency-track@2
  - component: gitlab.com/flarenetwork/ci-components-private/lint-dockerfile@2
  - component: gitlab.com/flarenetwork/ci-components-private/lint-shell@2
  - component: gitlab.com/flarenetwork/ci-components-private/lint-go@2
    inputs:
      go_version: "${GOLANG_VERSION}"
      golangci_version: "v2.11.3"
      golangci_config_file: ".golangci.yml"
  - template: Jobs/Secret-Detection.latest.gitlab-ci.yml

test:
  stage: test
  image: golang:${GOLANG_VERSION}
  tags:
    - flarenetwork-lg
  variables:
    MYSQL_ROOT_PASSWORD: "root"
    MYSQL_DATABASE: "db"
    POSTGRES_USER: "username"
    POSTGRES_PASSWORD: "password"
    POSTGRES_DB: "flare_xrp_indexer"
  services:
    - name: mysql:9
      alias: mysql
    - name: postgres:17
      alias: postgres
  cache:
    - key:
        files:
          - go.sum
        prefix: go-mod
      paths:
        - ${GOPATH}/pkg/mod
    - key:
        files:
          - go.sum
        prefix: go-cache-${GOLANG_VERSION}
      paths:
        - ${GOCACHE}
  before_script:
    - mkdir -p ${GOPATH} ${GOCACHE}
    - apt-get update && apt-get install -y default-mysql-client postgresql-client
    - |
      for _ in $(seq 1 30); do mysqladmin ping -h mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" --skip-ssl --silent && break; sleep 2; done
    - |
      for _ in $(seq 1 30); do PGPASSWORD="${POSTGRES_PASSWORD}" pg_isready -h postgres -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" && break; sleep 2; done
    - mysql -h mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" --skip-ssl "${MYSQL_DATABASE}" < internal/tests/docker/c-chain-idx.sql
    - PGPASSWORD="${POSTGRES_PASSWORD}" psql -h postgres -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -f internal/tests/docker/xrpl-idx.sql
    # Test fixtures hardcode the docker-compose loopback DSNs; point them at the service aliases instead.
    - grep -rl '127\.0\.0\.1:3306' internal | xargs -r sed -i 's/127\.0\.0\.1:3306/mysql:3306/g'
    - grep -rl 'localhost:5432' internal | xargs -r sed -i 's/localhost:5432/postgres:5432/g'
  script:
    - go test -tags integration -count=1 -coverpkg=./... -coverprofile=${COVERAGE_FILE} ./...
    - go tool cover -func=${COVERAGE_FILE}
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    paths:
      - ${COVERAGE_FILE}

test-coverage:
  stage: test
  image: golang:${GOLANG_VERSION}
  needs:
    - job: test
      artifacts: true
  script:
    - go run "github.com/boumenot/gocover-cobertura@${GOCOVER_COBERTURA_VERSION}" < ${COVERAGE_FILE} > ${COBERTURA_FILE}
  artifacts:
    when: always
    paths:
      - ${COBERTURA_FILE}
    reports:
      coverage_report:
        coverage_format: cobertura
        path: ${COBERTURA_FILE}
